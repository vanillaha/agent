[project]
name = "paper-evidence-qa"
version = "0.1.0"
description = "科研文献搜集与证据问答 Agent（S01）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.10.6,<3.0.0",
    "httpx>=0.27,<0.29",
    "pypdf>=6.0,<7.0",        # M5 文本层 PDF 解析（轻量）；复杂版式解析由 docling 提供
    "docling>=2.141,<3.0",    # M5 推荐解析器（AI 版面模型），Python 3.13 兼容性已验证
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
